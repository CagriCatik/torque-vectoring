# LQR über lineares Einspurmodell mit Gain-Scheduling (control.controllers.lqr.LQRConfig).
# Q = diag(1/s_beta^2, 1/s_r^2), R = (1000/M_scale)^2 (Moment in kNm).
schema_version: 1

controller:
  type: lqr
  id: lqr_yaw_sideslip
  description: Kontinuierlicher LQR auf [beta, r], Zusatzgiermoment
  provenance:
    source_type: engineering_assumption
    experimentally_validated: false
    origin: torquevector.control.controllers.lqr.LQRConfig (V11-Defaults, AST-eingefroren)
    notes: null
  weights:
    sideslip_scale_rad: 0.05
    yaw_rate_scale_rads: 0.08
    moment_scale_nm: 1500.0
  scheduling:
    min_speed_ms: 5.0
    max_speed_ms: 45.0
    speed_grid_ms: 0.5
    riccati: continuous_are
  feedforward_weight: 0.0
  output:
    yaw_moment_limit_nm: 2000.0
  yaw_reference:
    mu_source: tyre
    mu: null
