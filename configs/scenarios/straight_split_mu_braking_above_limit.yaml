# Szenario E (ABS): Vollbremsung auf Split-mu ÜBER der Nass-Haftgrenze (vorne 780 Nm > ~685 Nm, hinten
# 520 Nm > ~420 Nm). Ohne ABS blockiert das nasse Rad (Schlupf > 0.5) => FAIL_CLOSED; mit Profil
# configs/profiles/slip_control.yaml begrenzt der innere Regler den Bremsschlupf (docs/slip_control).
schema_version: 1

scenario:
  id: straight_split_mu_braking_above_limit
  description: Vollbremsung 15 m/s auf Split-mu über der Haftgrenze (ABS-Fall)
  provenance:
    source_type: engineering_assumption
    experimentally_validated: false
    origin: torquevector 12.1 slip-control scenario set (scenario E); synthetic friction values
    notes: "Bremsmomente bewusst über der Nass-Kapazität; nur mit ABS definiert."
  manoeuvre:
    kind: straight
    speed_ms: 15.0
    initial_speed_ms: null
    duration_s: 4.0                # endet über 5 m/s (Gültigkeitsgrenze LTV/NMPC), wie Szenario B
    path:
      radius_m: 90.0
      offset_m: 3.5
      entry_m: 20.0
      transition_m: 42.0
      plateau_m: 25.0
    steering:
      amplitude_deg: 0.0
      frequency_hz: 0.5
      excitation_start_s: 1.0
      max_steer_deg: 12.0
    path_following:
      cross_gain: 0.85
      heading_gain: 0.95
    speed_control:
      kp_nm_per_ms: 65.0
  simulation_duration_s: null
  initial_state:
    x_m: 0.0
    y_m: 0.0
    yaw_rad: 0.0
    vy_ms: 0.0
    yaw_rate_rads: 0.0
  road:
    model: road_surface
    surface: ../roads/split_mu.yaml
    left_mu: null
    right_mu: null
    step_time_s: null
    step_mu: null
  brake_phase:
    start_s: 1.6
    ramp_s: 0.35
    brake_torque_nm: {FL: 780.0, FR: 780.0, RL: 520.0, RR: 520.0}
    cut_drive: true
  drive_phase: null
  envelope:
    check_final_speed: false
