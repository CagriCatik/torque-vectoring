# Bremsen in der Kurve: kanonische ZOH-Variante des historischen V5-Grip-Tests.
# Endgeschwindigkeitsprüfung deaktiviert, weil das Manöver bewusst verzögert.
schema_version: 1

scenario:
  id: brake_in_turn
  description: Kreisbahnfolge 15 m/s mit Bremsphase ab 1.5 s
  provenance:
    source_type: engineering_assumption
    experimentally_validated: false
    origin: "cli.legacy.run_v5_grip_tests / evaluation.legacy_grip.run_tests (V5-Störmanöver): Bremsmoment 45 Nm je Rad ab 1.5 s, 0.35 s Smoothstep, Antrieb ausgeblendet"
    notes: Neu konfiguriertes, nicht validiertes Szenario; Bremswerte aus V5 übernommen, Grundmanöver circle_track. Kein Q-Gate-Nachweis.
  manoeuvre:
    kind: circle_track
    speed_ms: 15.0
    duration_s: 3.0
    path:
      radius_m: 90.0
      offset_m: 3.5
      entry_m: 20.0
      transition_m: 42.0
      plateau_m: 25.0
    steering:
      amplitude_deg: 1.5
      frequency_hz: 0.5
      excitation_start_s: 1.0
      max_steer_deg: 12.0
    path_following:
      cross_gain: 0.85
      heading_gain: 0.95
    speed_control:
      kp_nm_per_ms: 65.0
  simulation_duration_s: null   # null = manoeuvre.duration_s
  initial_state:
    x_m: 0.0
    y_m: 0.0
    yaw_rad: 0.0
    vy_ms: 0.0
    yaw_rate_rads: 0.0
  road:
    model: road_surface
    surface: null            # null = includes.road der Anwendung (Standard: trockene Fahrbahn)
    left_mu: null
    right_mu: null
    step_time_s: null
    step_mu: null
  brake_phase:
    start_s: 1.5
    ramp_s: 0.35
    brake_torque_nm: {FL: 45.0, FR: 45.0, RL: 45.0, RR: 45.0}
    cut_drive: true
  envelope:
    check_final_speed: false
